<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google OAuth Callback</title>
</head>
<body>
<script>
    /**
     * Google OAuth Callback Page
     *
     * Loaded by Google after user grants/denies Sheet Sync permission.
     * Extracts the authorization code and sends it back to the parent editor
     * window via postMessage, then closes itself.
     *
     * This page is served statically — no framework required.
     */
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    const payload = (code && state)
        ? { type: 'GOOGLE_OAUTH_SUCCESS', code, state }
        : { type: 'GOOGLE_OAUTH_ERROR', error: error || 'Missing code or state parameter' };

    // 1. BroadcastChannel (modern & immune to COOP / window.opener stripping)
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            const bc = new BroadcastChannel('google_oauth_channel');
            bc.postMessage(payload);
            bc.close();
        }
    } catch (e) {
        console.error('BroadcastChannel error:', e);
    }

    // 2. localStorage fallback for cross-window communication
    try {
        localStorage.setItem('google_oauth_event', JSON.stringify({ ...payload, _t: Date.now() }));
    } catch (e) {
        console.error('localStorage error:', e);
    }

    // 3. window.opener postMessage fallback
    try {
        if (window.opener) {
            window.opener.postMessage(payload, '*');
        }
    } catch (e) {
        console.error('postMessage error:', e);
    }

    // Close popup shortly
    setTimeout(() => {
        try {
            window.close();
        } catch (e) {}
    }, 400);
</script>
<p style="font-family: sans-serif; color: #666; text-align: center; margin-top: 48px;">
    Menyelesaikan autentikasi Google... Jendela ini akan menutup otomatis.
</p>
</body>
</html>
