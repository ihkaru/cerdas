services:
  # ==========================================
  # BACKEND (Laravel API)
  # ==========================================
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "9980:8080"
    env_file:
      - .env.docker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - mariadb
    volumes:
      - laravel_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================
  # REALTIME (Laravel Reverb)
  # ==========================================
  reverb:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081", "--debug"]
    ports:
      - "8081:8081"
    env_file:
      - .env.docker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      backend:
        condition: service_healthy
      mariadb:
        condition: service_started
    volumes:
      - laravel_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "artisan", "reverb:start", "--help"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ==========================================
  # DATABASE (MariaDB)
  # ==========================================
  mariadb:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cerdas
      MYSQL_USER: cerdas
      MYSQL_PASSWORD: secret
    ports:
      - "33066:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # ==========================================
  # CLIENT (Mobile PWA)
  # ==========================================
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile.prod
      args:
        VITE_API_BASE_URL: http://localhost:9980/api
        VITE_GOOGLE_CLIENT_ID: 133588067257-0huo4ja0kaavpg704si2htphl0kvgobt.apps.googleusercontent.com
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-reverb-app-key}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    restart: always
    ports:
      - "9981:80"
    depends_on:
      backend:
        condition: service_healthy

  # ==========================================
  # EDITOR (Web Dashboard)
  # ==========================================
  editor:
    build:
      context: .
      dockerfile: apps/editor/Dockerfile.prod
      args:
        VITE_API_BASE_URL: http://localhost:9980/api
        VITE_GOOGLE_CLIENT_ID: 133588067257-0huo4ja0kaavpg704si2htphl0kvgobt.apps.googleusercontent.com
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-reverb-app-key}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    restart: always
    ports:
      - "9982:80"
    depends_on:
      backend:
        condition: service_healthy

  # ==========================================
  # WORKER (Queue)
  # ==========================================
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    env_file:
      - .env.docker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage

  # ==========================================
  # SCHEDULER (Cron)
  # ==========================================
  scheduler:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    restart: always
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env.docker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage

volumes:
  mariadb_data:
  laravel_storage:
